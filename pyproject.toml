[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-noise-suppression"
version = "0.1.0"
description = "RL-based selection of DSP filters for environmental speech noise suppression"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "librosa>=0.10",
  "scikit-learn>=1.3",
  "pystoi>=0.4",
  "pesq>=0.0.4",
  "pandas>=2.0",
  "joblib>=1.3",
  "tqdm>=4.65",
]

[project.optional-dependencies]
app = ["gradio>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]
